  <rect x="36" y="136" width="60" height="16" rx="4" fill="#DBEAFE"/>
  <text x="42" y="147" font-family="sans-serif" font-size="9" fill="#1E40AF" font-weight="500">external</text>
  <text x="104" y="147" font-family="sans-serif" font-size="11" fill="#1E293B" font-weight="600">gmaps_lead_pipeline.py</text>
  <text x="36" y="168" font-family="sans-serif" font-size="10" fill="#64748B">Searches Google Maps for leads based on</text>
  <text x="36" y="182" font-family="sans-serif" font-size="10" fill="#64748B">business category and location.</text>
  <rect x="36" y="190" width="14" height="14" rx="4" fill="#EFF6FF"/><rect x="38" y="194" width="10" height="6" rx="1" fill="#3B82F6"/>
  <rect x="232" y="124" width="192" height="80" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="244" y="136" width="40" height="16" rx="4" fill="#FEF3C7"/>
  <text x="250" y="147" font-family="sans-serif" font-size="9" fill="#92400E" font-weight="500">cron</text>
  <text x="292" y="147" font-family="sans-serif" font-size="11" fill="#1E293B" font-weight="600">scrape_google_maps.py</text>
  <text x="244" y="168" font-family="sans-serif" font-size="10" fill="#64748B">Runs search on Google Maps through the</text>
  <text x="244" y="182" font-family="sans-serif" font-size="10" fill="#64748B">official API and stores raw results.</text>
  <rect x="244" y="190" width="14" height="14" rx="4" fill="#EFF6FF"/><rect x="246" y="194" width="10" height="6" rx="1" fill="#3B82F6"/>
  <rect x="440" y="124" width="176" height="80" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="452" y="147" font-family="sans-serif" font-size="11" fill="#1E293B" font-weight="600">enrich_emails.py</text>
  <text x="452" y="166" font-family="sans-serif" font-size="10" fill="#64748B">Enriches leads with email</text>
  <text x="452" y="180" font-family="sans-serif" font-size="10" fill="#64748B">data via AnyMailFinder.</text>
  <rect x="452" y="190" width="14" height="14" rx="4" fill="#EFF6FF"/><rect x="454" y="194" width="10" height="6" rx="1" fill="#3B82F6"/>
