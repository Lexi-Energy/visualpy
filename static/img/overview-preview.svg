  <path d="M256 84 L264 84 M268 84 L276 84" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <rect x="280" y="60" width="100" height="48" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="330" y="88" font-family="sans-serif" font-size="11" fill="#14532D" text-anchor="middle" font-weight="600">Storage</text>
  <text x="296" y="100" font-family="sans-serif" font-size="8" fill="#64748B">2 steps</text>
  <path d="M384 84 L392 84 M396 84 L404 84" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <rect x="408" y="60" width="100" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
