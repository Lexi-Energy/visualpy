  <text x="36" y="240" font-family="sans-serif" font-size="12" fill="#1E293B" font-weight="600">Services</text>
  <rect x="36" y="248" width="60" height="18" rx="4" fill="#EFF6FF"/><text x="44" y="260" font-family="sans-serif" font-size="9" fill="#1D4ED8">Google Sheets</text>
  <rect x="104" y="248" width="48" height="18" rx="4" fill="#EFF6FF"/><text x="112" y="260" font-family="sans-serif" font-size="9" fill="#1D4ED8">Google Maps</text>
  <rect x="160" y="248" width="74" height="18" rx="4" fill="#EFF6FF"/><text x="168" y="260" font-family="sans-serif" font-size="9" fill="#1D4ED8">AnyMailFinder</text>
  <rect x="242" y="248" width="60" height="18" rx="4" fill="#EFF6FF"/><text x="250" y="260" font-family="sans-serif" font-size="9" fill="#1D4ED8">PandaDoc</text>
  <rect x="336" y="218" width="280" height="60" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="348" y="240" font-family="sans-serif" font-size="12" fill="#1E293B" font-weight="600">Credentials</text>
  <rect x="348" y="248" width="100" height="18" rx="4" fill="#FEF3C7"/><text x="356" y="260" font-family="sans-serif" font-size="9" fill="#92400E">GOOGLE_API_KEY</text>
  <rect x="456" y="248" width="80" height="18" rx="4" fill="#FEF3C7"/><text x="464" y="260" font-family="sans-serif" font-size="9" fill="#92400E">SERPAPI_KEY</text>
  <rect x="544" y="248" width="52" height="18" rx="4" fill="#FEF3C7"/><text x="552" y="260" font-family="sans-serif" font-size="9" fill="#92400E">8 more</text>
  <!-- Sovereignty badge -->
  <rect x="24" y="292" width="592" height="28" rx="6" fill="#F0F9FF"/>
  <circle cx="40" cy="306" r="4" fill="#22C55E"/>
  <text x="52" y="310" font-family="sans-serif" font-size="10" fill="#0C4A6E">3 external services · 8 credentials detected · data leaves machine to Google Sheets, AnyMailFinder, PandaDoc</text>
  <!-- Step detail -->
  <rect x="24" y="330" width="592" height="18" rx="6" fill="#FAFAFA"/>
  <rect x="36" y="334" width="72" height="10" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="0.5"/>
  <text x="42" y="342" font-family="sans-serif" font-size="8" fill="#1E3A5F">External Service</text>
  <text x="116" y="342" font-family="sans-serif" font-size="9" fill="#334155">Fetches business listings from Google Maps API based on category &amp; location</text>
  <text x="492" y="342" font-family="monospace" font-size="8" fill="#94A3B8">L23 service: Google Maps</text>
</svg>