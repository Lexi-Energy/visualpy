  <text x="424" y="100" font-family="sans-serif" font-size="8" fill="#64748B">1 step</text>
  <path d="M512 84 L520 84 M524 84 L532 84" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <rect x="536" y="60" width="80" height="48" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="576" y="88" font-family="sans-serif" font-size="11" fill="#1F2937" text-anchor="middle" font-weight="600">Reporting</text>
  <text x="548" y="100" font-family="sans-serif" font-size="8" fill="#64748B">5 steps</text>
