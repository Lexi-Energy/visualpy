{% extends "base.html" %}

{% block title %}visualpy - {{ script.path }}{% endblock %}

{% block breadcrumb %}
<span class="text-gray-400 dark:text-gray-500">/</span>
<span class="text-sm text-gray-600 dark:text-gray-300" x-show="viewMode === 'business'">{{ humanize_filename(script.path) }}</span>
<span class="text-sm text-gray-600 dark:text-gray-300" x-show="viewMode === 'technical'">{{ script.path }}</span>
{% endblock %}

{% block content %}
{% include "partials/script_body.html" %}
{% endblock %}

{% block scripts %}
<script id="step-details" type="application/json">{{ step_details_json|default('{}')|safe }}</script>
<script>
window.STEP_DETAILS = (function () {
    var el = document.getElementById('step-details');
    try { return JSON.parse((el && el.textContent) || '{}'); }
    catch (err) { console.error('[visualpy] Could not parse step details:', err); return {}; }
})();
</script>
<script src="/static/js/script_view.js"></script>
<script>
    window.switchViewMode = function (isBiz) { return window.VisualPyScript.refreshView(isBiz); };
    document.addEventListener('DOMContentLoaded', function () { window.VisualPyScript.init(); });
</script>
{% endblock %}
